<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep studio dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141726" />
      <stop offset="55%" stop-color="#0D0F18" />
      <stop offset="100%" stop-color="#191326" />
    </linearGradient>

    <!-- Subtle ambient neon glow inside the squircle -->
    <radialGradient id="ambientGlow" cx="38%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#FF4D79" stop-opacity="0.22" />
      <stop offset="55%" stop-color="#7928CA" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Neon audio waveform vertical gradient (Warm Suno Amber -> Magenta -> Electric Violet) -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="45%" stop-color="#FF3D77" />
      <stop offset="100%" stop-color="#9D4EDD" />
    </linearGradient>

    <!-- Cyan-to-Mint neon gradient for the clock badge -->
    <linearGradient id="clockRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#00BBF9" />
    </linearGradient>

    <!-- Outer border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#FF2A85" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.65" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Main Rounded Squircle Background -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#ambientGlow)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Outer Studio Time Track Arc (Top-Left to Bottom-Left) -->
  <path
    d="M 256 68 A 188 188 0 1 0 78 318"
    fill="none"
    stroke="#272C42"
    stroke-width="10"
    stroke-linecap="round"
    stroke-dasharray="4 22"
  />

  <!-- Neon Audio Waveform Bars (5 bold bars so they stay crisp even at 16x16) -->
  <g filter="url(#softGlow)">
    <!-- Bar 1 (Left) -->
    <rect x="82" y="196" width="38" height="120" rx="19" fill="url(#waveGrad)" />
    <!-- Bar 2 (Mid-Left Tall) -->
    <rect x="142" y="122" width="38" height="268" rx="19" fill="url(#waveGrad)" />
    <!-- Bar 3 (Center Peak) -->
    <rect x="202" y="84" width="38" height="344" rx="19" fill="url(#waveGrad)" />
    <!-- Bar 4 (Mid-Right) -->
    <rect x="262" y="140" width="38" height="200" rx="19" fill="url(#waveGrad)" />
    <!-- Bar 5 (Right) -->
    <rect x="322" y="178" width="38" height="110" rx="19" fill="url(#waveGrad)" />
  </g>

  <!-- Modern Timestamp Clock Badge (Bottom-Right Foreground) -->
  <g transform="translate(344, 344)">
    <!-- Dark backing disc for high contrast separation from waveform -->
    <circle cx="0" cy="0" r="118" fill="#0B0D15" />
    <!-- Glowing Cyan/Blue Clock Bezel -->
    <circle
      cx="0"
      cy="0"
      r="98"
      fill="#121626"
      stroke="url(#clockRingGrad)"
      stroke-width="20"
    />

    <!-- 12 / 3 / 6 / 9 Tick Marks -->
    <circle cx="0" cy="-70" r="5" fill="#72EFDD" />
    <circle cx="70" cy="0" r="5" fill="#72EFDD" />
    <circle cx="0" cy="70" r="5" fill="#72EFDD" />
    <circle cx="-70" cy="0" r="5" fill="#72EFDD" />

    <!-- Clock Hands (10:10 / 2:00 studio angle, super bold for 16px visibility) -->
    <!-- Minute hand pointing up-left (12 o'clock) -->
    <line
      x1="0"
      y1="6"
      x2="0"
      y2="-54"
      stroke="#FFFFFF"
      stroke-width="18"
      stroke-linecap="round"
    />
    <!-- Hour hand pointing down-right (4 o'clock) -->
    <line
      x1="-4"
      y1="-2"
      x2="42"
      y2="28"
      stroke="#00F5D4"
      stroke-width="18"
      stroke-linecap="round"
    />
    <!-- Center Pivot Cap -->
    <circle cx="0" cy="0" r="13" fill="#FFB800" />
  </g>
</svg>
